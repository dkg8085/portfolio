name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings for production
        if: github.event_name == 'push'
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel project settings for preview
        if: github.event_name == 'pull_request'
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build production deployment
        if: github.event_name == 'push'
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build preview deployment
        if: github.event_name == 'pull_request'
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
