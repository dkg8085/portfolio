name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx vercel@65.14.0 deploy --yes --prod --project=portfolio --scope=dkg8085s-projects

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx vercel@65.14.0 deploy --yes --project=portfolio --scope=dkg8085s-projects
